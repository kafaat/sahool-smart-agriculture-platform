version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: sahool_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sahool_db}
      MYSQL_USER: ${MYSQL_USER:-sahool_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sahool_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahool_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://${MYSQL_USER:-sahool_user}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-sahool_db}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - VITE_APP_TITLE=${VITE_APP_TITLE:-منصة سهول الزراعية الذكية}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sahool_network
    volumes:
      - ./logs:/app/logs

volumes:
  mysql_data:
    driver: local

networks:
  sahool_network:
    driver: bridge
